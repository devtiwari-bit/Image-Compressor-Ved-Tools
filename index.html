<title>Compress Image to 100KB Free Online – Ved Tools Production</title>
<meta name="description" content="Free image compressor. Reduce photo size to 20KB, 50KB, 100KB or 200KB in your browser. No upload, no signup.">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7fb;--card:#fff;--text:#1b1f2a;--muted:#667085;--line:#e3e6ee;--accent:#2563eb;--accent-t:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c1f2b;--text:#eef0f6;--muted:#9aa3b5;--line:#2d3243;--accent:#38bdf8;--accent-t:#12141c}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1c1f2b;--text:#eef0f6;--muted:#9aa3b5;--line:#2d3243;--accent:#38bdf8;--accent-t:#12141c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:28px 12px;text-align:center;cursor:pointer;color:var(--muted)}
.drop b{color:var(--accent)}
label{display:block;font-size:.9rem;font-weight:600;margin:12px 0 6px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;font-size:.95rem}
.seg button.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
input[type=range]{width:100%}
input[type=number],select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:1rem}
.go{width:100%;padding:13px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-t);font-size:1rem;font-weight:700;margin-top:14px}
.go:disabled{opacity:.5}
.item{display:flex;gap:12px;align-items:center}
.item img{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:none;background:var(--line)}
.info{flex:1;min-width:0;font-size:.85rem}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sizes{color:var(--muted)}
.save{color:#16a34a;font-weight:700}
.dl{padding:9px 12px;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:10px;font-weight:600}
.hide{display:none}
.brand{display:flex;align-items:center;gap:10px;padding:4px 0 14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.logo{width:48px;height:48px;flex:none}
.bn{font-weight:800;line-height:1.1}
.bt{font-size:.75rem;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:24px;padding-top:14px;border-top:1px solid var(--line)}
footer b{color:var(--text)}
.note{font-size:.8rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<main>
<div class="brand"><svg class="logo" viewBox="-70 -70 140 140" aria-label="Ved Tools Production logo"><defs><linearGradient id="vg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs><rect x="-70" y="-70" width="140" height="140" rx="30" fill="#0b1220"/><circle r="50" fill="none" stroke="url(#vg)" stroke-width="12" stroke-dasharray="9.8 9.8" transform="rotate(5)"/><circle r="41" fill="url(#vg)"/><circle r="28" fill="#0b1220"/><path d="M-15 -14 L0 16 L15 -14 L8 -14 L0 2 L-8 -14 Z" fill="#fff"/></svg><div><div class="bn">Ved Tools Production</div><div class="bt">Free online tools</div></div></div>
<h1>Image Compressor</h1>
<p class="sub">Reduce photo file size in your browser. Nothing is uploaded.</p>

<div class="card">
  <div class="drop" id="drop" tabindex="0"><b>Tap to choose photos</b><br>JPG, PNG or WebP</div>
  <input type="file" id="file" accept="image/*" multiple class="hide">

  <label>Compress by</label>
  <div class="row seg" id="mode">
    <button class="on" data-m="size">Target size</button>
    <button data-m="quality">Quality</button>
  </div>

  <div id="sizeBox">
    <label>Make each image under (KB)</label>
    <input type="number" id="kb" value="200" min="10" step="10">
  </div>
  <div id="qBox" class="hide">
    <label>Quality: <span id="qv">70</span>%</label>
    <input type="range" id="q" min="10" max="95" value="70">
  </div>

  <label>Max width (optional)</label>
  <select id="w">
    <option value="0">Keep original</option>
    <option value="1920">1920 px</option>
    <option value="1280">1280 px</option>
    <option value="800">800 px</option>
  </select>

  <button class="go" id="go" disabled>Compress</button>
</div>

<div id="out"></div>
<p class="note">Output is saved as JPEG (smallest for photos).</p>
<footer>© 2026 <b>Ved Tools Production</b>. All rights reserved.</footer>
</main>

<script>
(function(){
  var files=[],mode="size";
  var $=function(i){return document.getElementById(i)};
  var drop=$("drop"),inp=$("file"),go=$("go"),out=$("out");

  drop.onclick=function(){inp.click()};
  drop.onkeydown=function(e){if(e.key==="Enter")inp.click()};
  inp.onchange=function(){
    files=Array.prototype.slice.call(inp.files);
    drop.innerHTML="<b>"+files.length+" photo"+(files.length===1?"":"s")+" selected</b><br>Tap to change";
    go.disabled=!files.length;out.innerHTML="";
  };
  $("q").oninput=function(){$("qv").textContent=this.value};
  Array.prototype.forEach.call(document.querySelectorAll("#mode button"),function(b){
    b.onclick=function(){
      mode=b.dataset.m;
      document.querySelectorAll("#mode button").forEach(function(x){x.classList.toggle("on",x===b)});
      $("sizeBox").classList.toggle("hide",mode!=="size");
      $("qBox").classList.toggle("hide",mode!=="quality");
    };
  });

  function fmt(n){return n>1048576?(n/1048576).toFixed(2)+" MB":Math.round(n/1024)+" KB"}
  function load(f){return new Promise(function(res,rej){
    var u=URL.createObjectURL(f),im=new Image();
    im.onload=function(){URL.revokeObjectURL(u);res(im)};
    im.onerror=rej;im.src=u;
  })}
  function toBlob(c,q){return new Promise(function(r){c.toBlob(r,"image/jpeg",q)})}

  async function compress(f){
    var im=await load(f),maxW=+$("w").value,s=1;
    if(maxW&&im.width>maxW)s=maxW/im.width;
    var c=document.createElement("canvas");
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);
    x.drawImage(im,0,0,c.width,c.height);
    if(mode==="quality")return toBlob(c,+$("q").value/100);
    var target=Math.max(10,+$("kb").value||200)*1024,lo=0.05,hi=0.95,best=await toBlob(c,lo);
    if(best.size>target){ // still too big: shrink dimensions
      var k=1;
      while(best.size>target&&k>0.15){k*=0.8;
        var c2=document.createElement("canvas");c2.width=Math.round(c.width*k);c2.height=Math.round(c.height*k);
        var x2=c2.getContext("2d");x2.fillStyle="#fff";x2.fillRect(0,0,c2.width,c2.height);
        x2.drawImage(c,0,0,c2.width,c2.height);best=await toBlob(c2,0.5);}
      return best;
    }
    for(var i=0;i<7;i++){var m=(lo+hi)/2,b=await toBlob(c,m);
      if(b.size<=target){best=b;lo=m}else hi=m}
    return best;
  }

  go.onclick=async function(){
    go.disabled=true;go.textContent="Compressing...";out.innerHTML="";
    for(var i=0;i<files.length;i++){
      var f=files[i],card=document.createElement("div");card.className="card item";
      try{
        var b=await compress(f),url=URL.createObjectURL(b);
        var pct=Math.max(0,Math.round((1-b.size/f.size)*100));
        var base=f.name.replace(/\.[^.]+$/,"")+"-compressed.jpg";
        card.innerHTML='<img src="'+url+'" alt=""><div class="info"><div class="name"></div><div class="sizes">'+fmt(f.size)+' → <b>'+fmt(b.size)+'</b></div><div class="save">'+(b.size<f.size?'Saved '+pct+'%':'Already small')+'</div></div><button class="dl">Save</button>';
        card.querySelector(".name").textContent=f.name;
        (function(url,base,btn){btn.onclick=function(){
          var a=document.createElement("a");a.href=url;a.download=base;
          document.body.appendChild(a);a.click();a.remove();btn.textContent="Saved ✓";
        }})(url,base,card.querySelector(".dl"));
      }catch(e){card.textContent="Could not read "+f.name}
      out.appendChild(card);
    }
    go.disabled=false;go.textContent="Compress";
  };
})();
</script>
</body>
</html>
